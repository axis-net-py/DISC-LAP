<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teste DISC — Método LAP</title>
  <meta name="description" content="Teste de Personalidade DISC — Engenharia Comportamental pelo Método LAP de Jocelaine Rufatto." />
  <meta property="og:title" content="Teste DISC — Método LAP" />
  <meta property="og:description" content="Descubra seu perfil comportamental DISC com o Método LAP." />
  <meta property="og:image" content="https://metodolap.vercel.app/logo.png" />
  <link rel="icon" href="https://metodolap.vercel.app/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:            #fdfdfc; /* offwhite from landing page */
      --surface:       #ffffff; /* white-pure */
      --surface2:      #f7f6f2; /* ivory */
      --surface3:      #eeeeea;
      --border:        rgba(212, 175, 55, 0.25); /* border-gold */
      --border-md:     rgba(212, 175, 55, 0.45);
      --gold:          #d4af37; /* accent-gold */
      --gold-lt:       rgba(212, 175, 55, 0.08);
      --gold-dk:       #aa8c2c;
      --navy:          #0a192f; /* primary-navy */
      --text:          #0a1220; /* text-dark */
      --text2:         #5e667e; /* text-muted */
      --text3:         #8e96aa;

      /* DISC standard colors (D=Red, I=Yellow, S=Green, C=Blue) */
      --red-bg:        #fdf2f2; --red-txt:   #9b1c1c; --red-str:   #f8b4b4;
      --amber-bg:      #fdfbeb; --amber-txt: #723b13; --amber-str: #fde8a8;
      --teal-bg:       #f3faf7; --teal-txt:  #03543f; --teal-str:  #b3f5e2;
      --blue-bg:       #f0f5ff; --blue-txt:  #1e40af; --blue-str:  #bfdbfe;

      --r: 12px;
      --r-sm: 8px;
      --shadow: 0 4px 20px rgba(10, 25, 47, 0.04);
      --shadow-lg: 0 10px 30px rgba(10, 25, 47, 0.08);
    }

    html { background: var(--bg); color: var(--text); scroll-behavior: smooth; }
    
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 5rem;
      background: var(--bg);
      position: relative;
    }

    body::before {
      content: "";
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 9999; opacity: 0.25;
    }

    #app { width: 100%; max-width: 540px; position: relative; z-index: 10; }
    .screen { display: none; }
    .screen.active { display: block; }

    /* ── LANG SWITCHER ── */
    .lang-bar { display: flex; justify-content: flex-end; margin-bottom: 1.5rem; }
    .lang-switcher {
      display: flex;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .lang-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px;
      font-family: 'Inter', sans-serif;
      font-size: 13px; font-weight: 500;
      background: transparent; border: none;
      cursor: pointer; color: var(--text2);
      transition: all 0.2s ease;
      border-right: 1px solid var(--border);
    }
    .lang-btn:last-child { border-right: none; }
    .lang-btn.active { background: var(--navy); color: #fff; font-weight: 600; }
    .lang-btn:not(.active):hover { background: var(--surface3); color: var(--navy); }
    .flag-icon { width: 20px; height: 14px; border-radius: 2px; overflow: hidden; flex-shrink: 0; display: block; }

    /* ── LOGO ── */
    .lap-logo {
      display: flex;
      justify-content: center;
      margin-bottom: 1.5rem;
      background: var(--navy);
      padding: 12px 24px;
      border-radius: var(--r);
      border-bottom: 2px solid var(--gold);
      box-shadow: var(--shadow);
    }
    .lap-logo img { height: 48px; object-fit: contain; }
    
    .lap-logo-sm {
      display: flex;
      justify-content: center;
      margin-bottom: 1.25rem;
      background: var(--navy);
      padding: 8px 16px;
      border-radius: var(--r-sm);
      border-bottom: 2px solid var(--gold);
      box-shadow: var(--shadow);
    }
    .lap-logo-sm img { height: 28px; object-fit: contain; }

    /* ── DISC BADGES ── */
    .disc-row { display: flex; justify-content: center; gap: 12px; margin-bottom: 1.5rem; }
    .disc-badge {
      width: 48px; height: 48px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Cinzel', serif;
      font-size: 22px; font-weight: 700;
      box-shadow: var(--shadow);
    }
    .db-D { background: var(--red-bg);   color: var(--red-txt);   border: 1px solid var(--red-str); }
    .db-I { background: var(--amber-bg); color: var(--amber-txt); border: 1px solid var(--amber-str); }
    .db-S { background: var(--teal-bg);  color: var(--teal-txt);  border: 1px solid var(--teal-str); }
    .db-C { background: var(--blue-bg);  color: var(--blue-txt);  border: 1px solid var(--blue-str); }

    /* ── TYPOGRAPHY ── */
    h1 {
      font-family: 'Cinzel', serif;
      font-size: 26px; font-weight: 700;
      color: var(--navy); line-height: 1.3;
      text-align: center; margin-bottom: .4rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .tagline {
      font-size: 13px; color: var(--gold-dk);
      text-align: center; letter-spacing: .06em;
      text-transform: uppercase; margin-bottom: 1.5rem;
      font-weight: 600;
    }
    .divider {
      width: 50px; height: 2px;
      background: var(--gold);
      margin: 0 auto 1.5rem;
    }

    /* ── CARD ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 1.5rem;
      margin-bottom: 1.25rem;
      box-shadow: var(--shadow);
    }
    .card label {
      display: block; font-size: 13px;
      color: var(--text2); margin-bottom: 10px;
      letter-spacing: .02em;
      font-weight: 500;
    }
    .card input[type="text"] {
      width: 100%; padding: 12px 14px;
      font-family: 'Inter', sans-serif;
      font-size: 15px; color: var(--text);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      outline: none;
      transition: all 0.2s ease;
    }
    .card input[type="text"]:focus {
      border-color: var(--gold);
      background: var(--surface);
      box-shadow: 0 0 0 3px rgba(212,175,55,.15);
    }

    /* ── INSTRUCTIONS ── */
    .instructions {
      display: none;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 1.5rem;
      margin-bottom: 1.25rem;
      box-shadow: var(--shadow);
    }
    .instructions.visible { display: block; }
    .instr-header {
      display: flex; align-items: center; gap: 10px;
      font-size: 14px; font-weight: 600;
      color: var(--navy); margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .instr-icon {
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--gold); color: var(--navy);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; flex-shrink: 0;
    }
    .instr-list { list-style: none; margin-bottom: 1.25rem; }
    .instr-list li {
      font-size: 14px; color: var(--text2);
      line-height: 1.6; padding: .4rem 0 .4rem 1.2rem;
      position: relative;
    }
    .instr-list li::before {
      content: ""; position: absolute;
      left: 0; top: .75rem;
      width: 6px; height: 6px;
      border-radius: 50%; background: var(--gold);
    }
    .scale-row { display: flex; gap: 8px; margin-top: 10px; }
    .scale-item {
      flex: 1; text-align: center;
      padding: 12px 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      box-shadow: var(--shadow);
    }
    .scale-num { font-size: 18px; font-weight: 700; color: var(--navy); font-family: 'Cinzel', serif; }
    .scale-lbl {
      font-size: 10px; color: var(--text2);
      margin-top: 4px; line-height: 1.3;
      white-space: pre-line;
      font-family: 'Inter', sans-serif;
    }

    /* ── BUTTONS ── */
    .btn-primary {
      width: 100%; padding: 14px;
      font-family: 'Inter', sans-serif;
      font-size: 14px; font-weight: 600;
      background: var(--navy); color: #fff;
      border: none; border-radius: var(--r-sm);
      cursor: pointer; transition: all 0.3s ease;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: .25rem;
      box-shadow: 0 4px 12px rgba(10, 25, 47, 0.15);
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--gold);
      color: var(--navy);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(212, 175, 55, 0.25);
    }
    .btn-primary:disabled { opacity: .25; cursor: not-allowed; transform: none; box-shadow: none; }

    .btn-ghost {
      flex: 1; padding: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 14px; font-weight: 500;
      border: 1px solid var(--border-md);
      border-radius: var(--r-sm);
      background: transparent; color: var(--navy);
      cursor: pointer; transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn-ghost:hover:not(:disabled) { background: var(--surface2); border-color: var(--navy); }
    .btn-ghost:disabled { opacity: .25; cursor: not-allowed; }

    .btn-next {
      flex: 2; padding: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 14px; font-weight: 600;
      background: var(--navy); color: #fff;
      border: none; border-radius: var(--r-sm);
      cursor: pointer; transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn-next:disabled { opacity: .25; cursor: not-allowed; }
    .btn-next:not(:disabled):hover { background: var(--gold); color: var(--navy); }

    /* ── PROGRESS ── */
    .progress-wrap {
      height: 4px; background: var(--surface3);
      border-radius: 2px; margin-bottom: 1.5rem;
      overflow: hidden;
    }
    .progress-fill {
      height: 4px; background: var(--gold);
      border-radius: 2px; transition: width .35s ease;
    }

    /* ── QUIZ ── */
    .q-meta {
      display: flex; justify-content: space-between;
      align-items: center;
      font-size: 13px; color: var(--text2);
      margin-bottom: 1rem;
      font-family: 'Inter', sans-serif;
    }
    .q-dim-badge {
      font-size: 11px; font-weight: 600;
      padding: 4px 12px; border-radius: 20px;
      letter-spacing: .05em;
      text-transform: uppercase;
    }
    .qdim-D { background: var(--red-bg);   color: var(--red-txt); }
    .qdim-I { background: var(--amber-bg); color: var(--amber-txt); }
    .qdim-S { background: var(--teal-bg);  color: var(--teal-txt); }
    .qdim-C { background: var(--blue-bg);  color: var(--blue-txt); }

    .q-text {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 22px; font-weight: 500;
      color: var(--navy); line-height: 1.5;
      margin-bottom: 1.5rem;
      text-align: center;
      font-style: italic;
    }
    .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1.5rem; }
    .option-btn {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      cursor: pointer; text-align: left;
      font-family: 'Inter', sans-serif;
      font-size: 14px; color: var(--text);
      box-shadow: var(--shadow);
      transition: all 0.2s ease;
    }
    .option-btn:hover { border-color: var(--gold); background: var(--surface2); }
    .option-btn.selected {
      border: 1.5px solid var(--gold);
      background: var(--gold-lt);
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.15);
    }
    .option-dot {
      width: 18px; height: 18px; border-radius: 50%;
      border: 1.5px solid var(--border-md);
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s ease;
    }
    .option-btn.selected .option-dot {
      background: var(--navy); border-color: var(--navy);
    }
    .option-btn.selected .option-dot::after {
      content: ''; width: 6px; height: 6px;
      border-radius: 50%; background: var(--gold);
    }
    .nav-row { display: flex; gap: 10px; }

    /* ── RESULT ── */
    .result-header { text-align: center; padding: .5rem 0 1.5rem; }
    .result-name {
      font-family: 'Cinzel', serif;
      font-size: 26px; font-weight: 700;
      color: var(--navy); margin-bottom: .3rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .result-sub { font-size: 13px; color: var(--gold-dk); letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }

    .scores-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1.5rem; }
    .score-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 1.25rem 1.5rem;
      box-shadow: var(--shadow);
      transition: transform 0.3s ease;
    }
    .score-card:hover { transform: translateY(-2px); }
    .score-card.rank1 {
      grid-column: 1 / -1;
      border-color: var(--gold);
      background: linear-gradient(135deg, #ffffff 0%, #fdfcf7 100%);
      box-shadow: var(--shadow-lg);
    }
    .score-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .score-lbl { font-size: 14px; font-weight: 600; color: var(--navy); font-family: 'Cinzel', serif; letter-spacing: 1px; }
    .score-badge { font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .sb-D { background: var(--red-bg);   color: var(--red-txt); }
    .sb-I { background: var(--amber-bg); color: var(--amber-txt); }
    .sb-S { background: var(--teal-bg);  color: var(--teal-txt); }
    .sb-C { background: var(--blue-bg);  color: var(--blue-txt); }
    .score-num {
      font-family: 'Cinzel', serif;
      font-size: 32px; font-weight: 700;
      color: var(--navy); margin-bottom: 8px;
    }
    .score-bar-bg { height: 6px; background: var(--surface3); border-radius: 3px; }
    .score-bar { height: 6px; border-radius: 3px; transition: width 1.1s ease; }
    .bar-D { background: #e23636; }
    .bar-I { background: #f3d231; }
    .bar-S { background: #3c9c3c; }
    .bar-C { background: #3636e2; }

    .profile-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 1.75rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-lg);
    }
    .profile-card-head { display: flex; align-items: center; gap: 14px; margin-bottom: 1.25rem; }
    .profile-card-head h2 {
      font-family: 'Cinzel', serif;
      font-size: 20px; font-weight: 700; color: var(--navy);
      letter-spacing: 1px;
    }
    .profile-card-head .label-small {
      font-size: 11px; color: var(--gold-dk);
      text-transform: uppercase; letter-spacing: .08em;
      display: block; margin-bottom: 4px;
      font-weight: 600;
    }
    .traits-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1.25rem; }
    .trait-pill { font-size: 12px; padding: 5px 12px; border-radius: 20px; font-weight: 500; }
    .tp-D { background: var(--red-bg);   color: var(--red-txt); }
    .tp-I { background: var(--amber-bg); color: var(--amber-txt); }
    .tp-S { background: var(--teal-bg);  color: var(--teal-txt); }
    .tp-C { background: var(--blue-bg);  color: var(--blue-txt); }

    .profile-body p {
      font-size: 14.5px; color: var(--text2);
      line-height: 1.7; margin-bottom: 1rem;
    }
    .profile-body p:last-child { margin-bottom: 0; }
    .growth-quote {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic; font-size: 17px !important;
      color: var(--navy) !important;
      border-left: 3px solid var(--gold);
      padding-left: 16px;
      margin-top: 1.25rem;
      font-weight: 500;
    }

    .result-footer {
      text-align: center;
      padding: 2rem 0 1rem;
      margin-top: 2rem;
      border-top: 1px solid var(--border);
    }
    .result-footer img {
      height: 32px;
      object-fit: contain;
      background: var(--navy);
      padding: 6px 16px;
      border-radius: var(--r-sm);
      border-bottom: 2px solid var(--gold);
    }
    .result-footer p {
      font-size: 12px;
      color: var(--text3);
      margin-top: 0.75rem;
      letter-spacing: 0.5px;
      font-family: 'Inter', sans-serif;
    }

    .btn-restart {
      width: 100%; margin-top: .75rem; padding: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 14px; font-weight: 600;
      border: 1px solid var(--border-md);
      border-radius: var(--r-sm);
      background: transparent; color: var(--navy);
      cursor: pointer; transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn-restart:hover { background: var(--surface2); border-color: var(--navy); }

    /* ── ADMIN PANEL ── */
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }
    .admin-title {
      font-family: 'Cinzel', serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: 1px;
    }
    .admin-actions {
      display: flex;
      gap: 10px;
      margin-bottom: 1.25rem;
    }
    .admin-search {
      width: 100%;
      padding: 10px 12px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      margin-bottom: 1rem;
      outline: none;
      box-shadow: var(--shadow);
    }
    .admin-search:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(212,175,55,.15);
    }
    .table-container {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      background: var(--surface);
      box-shadow: var(--shadow);
      margin-bottom: 1.5rem;
    }
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      text-align: left;
    }
    .admin-table th, .admin-table td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--surface2);
    }
    .admin-table th {
      background: var(--surface2);
      color: var(--navy);
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.5px;
    }
    .admin-table tr:hover { background: var(--surface2); }
    .webhook-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow);
    }
    .webhook-card h3 {
      font-family: 'Cinzel', serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }
    .webhook-card p {
      font-size: 12px;
      color: var(--text2);
      margin-bottom: 10px;
      line-height: 1.4;
    }
    .webhook-row {
      display: flex;
      gap: 10px;
    }
    .webhook-input {
      flex: 1;
      padding: 8px 12px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      outline: none;
    }
    .webhook-input:focus { border-color: var(--gold); }
    .btn-sm {
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 600;
      border-radius: var(--r-sm);
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }
    .btn-sm.btn-navy {
      background: var(--navy);
      color: #fff;
      border: none;
    }
    .btn-sm.btn-navy:hover {
      background: var(--gold);
      color: var(--navy);
    }
    .btn-sm.btn-outline {
      background: transparent;
      color: var(--navy);
      border: 1px solid var(--border-md);
    }
    .btn-sm.btn-outline:hover {

        d1:"Representas el pegamento que mantiene equipos y relaciones funcionando. Tu paciencia, consistencia y capacidad de crear entornos seguros son características raras y muy valoradas en contextos de alta presión.",

        d1:"Piensas antes de actuar, analizas antes de decidir y entregas con calidad por encima del promedio. En contextos que exigen rigor técnico, estructura y precisión, rindes a un nivel que otros perfiles raramente alcanzan.",
        d2:"Tu ojo para las inconsistencias y tu capacidad de organizar información compleja son activos reales. Frecuentemente identificas riesgos que otros ignoran — y eso tiene alto valor estratégico cuando está bien posicionado.",
        d3:"Punto de atención: la búsqueda de información perfecta antes de decidir puede crear parálisis por análisis. En un mercado que cambia rápido, una buena decisión tomada ahora supera a una decisión perfecta tomada tarde.",
        growth:"Define umbrales de decisión claros. Con el 80% de la información disponible, decide. Refinar en movimiento es una habilidad que puedes construir."}

};

let lang = 'pt', userName = '', userPhone = '', currentQ = 0;
let answers = new Array(24).fill(null);

const DESTAND_PHONE = "5549998401834"; // Mentora Jocelaine

function setLang(l) {
  lang = l;
  document.documentElement.lang = CONTENT[l].langAttr;
  document.getElementById('btn-pt').classList.toggle('active', l === 'pt');
  document.getElementById('btn-es').classList.toggle('active', l === 'es');
  renderIntro();
  if (document.getElementById('screen-quiz').classList.contains('active')) renderQuestion();
  if (document.getElementById('screen-result').classList.contains('active')) renderResult(calcScores());
}

function renderIntro() {
  const c = CONTENT[lang];
  document.getElementById('intro-title').textContent = c.introTitle;
  document.getElementById('intro-tagline').textContent = c.introTagline;
  document.getElementById('name-label').textContent = c.nameLabel;
  document.getElementById('nameInput').placeholder = c.namePlaceholder;
  document.getElementById('phone-label').textContent = c.phoneLabel;
  document.getElementById('phoneInput').placeholder = c.phonePlaceholder;
  document.getElementById('start-label').textContent = c.startLabel;
  document.getElementById('instr-title').textContent = c.instrTitle;
  document.getElementById('instr-list').innerHTML = c.instrItems.map(i => `<li>${i}</li>`).join('');
  document.getElementById('instr-scale').innerHTML = c.scaleItems.map(s =>
    `<div class="scale-item"><div class="scale-num">${s.n}</div><div class="scale-lbl">${s.l}</div></div>`
  ).join('');
  
  const nameVal = document.getElementById('nameInput').value.trim();
  const phoneVal = document.getElementById('phoneInput').value.trim();
  const nameOk = nameVal.length >= 2;
  const phoneOk = phoneVal.replace(/\D/g, '').length >= 8;
  const ok = nameOk && phoneOk;
  
  document.getElementById('instructions-box').classList.toggle('visible', ok);
  document.getElementById('startBtn').disabled = !ok;
}

function checkInputs() {
  const nameVal = document.getElementById('nameInput').value.trim();
  const phoneVal = document.getElementById('phoneInput').value.trim();
  const nameOk = nameVal.length >= 2;
  const phoneOk = phoneVal.replace(/\D/g, '').length >= 8;
  const ok = nameOk && phoneOk;
  document.getElementById('startBtn').disabled = !ok;
  document.getElementById('instructions-box').classList.toggle('visible', ok);
}

function startQuiz() {
  userName = document.getElementById('nameInput').value.trim();
  userPhone = document.getElementById('phoneInput').value.trim();
  currentQ = 0; answers = new Array(24).fill(null);
  showScreen('quiz'); renderQuestion();
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderQuestion() {
  const c = CONTENT[lang];
  const q = c.questions[currentQ];
  const total = c.questions.length;
  document.getElementById('progressFill').style.width = ((currentQ / total) * 100) + '%';
  document.getElementById('qCounter').textContent = c.qLabel + ' ' + (currentQ + 1) + ' ' + c.qOf + ' ' + total;
  const badge = document.getElementById('qDimBadge');
  badge.textContent = c.profileLabel + ' ' + q.dim;
  badge.className = 'q-dim-badge qdim-' + q.dim;
  document.getElementById('qText').textContent = q.text;
  document.getElementById('prevBtn').textContent = c.prevLabel;
  document.getElementById('prevBtn').disabled = currentQ === 0;
  document.getElementById('nextBtn').textContent = currentQ === total - 1 ? c.finishLabel : c.nextLabel;
  document.getElementById('nextBtn').disabled = answers[currentQ] === null;
  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  c.options.forEach((opt, i) => {
    const val = i + 1;
    const btn = document.createElement('button');
    btn.className = 'option-btn' + (answers[currentQ] === val ? ' selected' : '');
    btn.innerHTML = '<div class="option-dot"></div><span>' + opt + '</span>';
    btn.onclick = () => selectOption(val);
    container.appendChild(btn);
  });
}

function selectOption(val) {
  answers[currentQ] = val;
  renderQuestion();
  setTimeout(() => {
    nextQ();
  }, 250);
}

function nextQ() {
  const total = CONTENT[lang].questions.length;
  if (currentQ < total - 1) { currentQ++; renderQuestion(); }
  else {
    const s = calcScores();
    renderResult(s);
    saveResultToDb(s);
    showScreen('result');
  }
}

function prevQ() {
  if (currentQ > 0) { currentQ--; renderQuestion(); }
}

function calcScores() {
  const c = CONTENT[lang];
  const scores = {D:0,I:0,S:0,C:0};
  c.questions.forEach((q, i) => { if (answers[i] !== null) scores[q.dim] += answers[i]; });
  return scores;
}

function renderResult(scores) {
  const c = CONTENT[lang];
  const maxScore = 24; // 6 questions * 4 max val
  const sorted = Object.entries(scores).sort((a,b) => b[1]-a[1]);
  document.getElementById('resultName').textContent = userName;
  document.getElementById('result-sub').textContent = c.resultSub;
  document.getElementById('footer-text').textContent = c.footerText;
  document.getElementById('restartBtn').textContent = c.restartLabel;
  
  // Set WhatsApp button translations
  document.getElementById('wa-student-label').textContent = c.waStudentLabel;
  document.getElementById('wa-coach-label').textContent = c.waCoachLabel;
  
  const grid = document.getElementById('scoresGrid');
  grid.innerHTML = '';
  sorted.forEach(([dim, score], idx) => {
    const pct = Math.round((score / maxScore) * 100);
    const pr = c.profiles[dim];
    const card = document.createElement('div');
    card.className = 'score-card' + (idx === 0 ? ' rank1' : '');
    card.innerHTML = `
      <div class="score-top">
        <span class="score-lbl">${pr.name}</span>
        <span class="score-badge sb-${dim}">${pr.keyword}</span>
      </div>
      <div class="score-num">${pct}%</div>
      <div class="score-bar-bg"><div class="score-bar bar-${dim}" style="width:0%" data-pct="${pct}"></div></div>
    `;
    grid.appendChild(card);
  });
  setTimeout(() => {
    document.querySelectorAll('.score-bar').forEach(b => { b.style.width = b.dataset.pct + '%'; });
  }, 120);
  const [topDim] = sorted[0];
  const p = c.profiles[topDim];
  document.getElementById('profileDetail').innerHTML = `
    <div class="profile-card">
      <div class="profile-card-head">
        <div class="disc-badge db-${topDim}" style="width:38px;height:38px;font-size:17px;flex-shrink:0;">${topDim}</div>
        <div>
          <span class="label-small">${c.domProfile}</span>
          <h2>${p.name}</h2>
        </div>
      </div>
      <div class="traits-row">${p.traits.map(t=>`<span class="trait-pill tp-${topDim}">${t}</span>`).join('')}</div>
      <div class="profile-body">
        <p>${p.d1}</p>
        <p>${p.d2}</p>
        <p>${p.d3}</p>
        <p class="growth-quote">${p.growth}</p>
      </div>
    </div>
  `;
}

function saveResultToDb(scores) {
  const c = CONTENT[lang];
  const maxScore = 24;
  const sorted = Object.entries(scores).sort((a,b) => b[1]-a[1]);
  const [topDim] = sorted[0];
  const p = c.profiles[topDim];
  
  const pctD = Math.round((scores.D / maxScore) * 100);
  const pctI = Math.round((scores.I / maxScore) * 100);
  const pctS = Math.round((scores.S / maxScore) * 100);
  const pctC = Math.round((scores.C / maxScore) * 100);

  const result = {
    id: 'lap_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
    date: new Date().toLocaleString(),
    name: userName,
    phone: userPhone,
    profile: p.name + ' (' + p.keyword + ')',
    pctD, pctI, pctS, pctC,
    rawDate: Date.now()
  };

  // 1. Save locally in localStorage
  let saved = [];
  try {
    const raw = localStorage.getItem('lap_disc_results');
    if (raw) saved = JSON.parse(raw);
  } catch (e) { console.error(e); }
  saved.push(result);
  localStorage.setItem('lap_disc_results', JSON.stringify(saved));

  // Save specific user result for retrieval on refresh
  try {
    localStorage.setItem('lap_my_result', JSON.stringify({
      name: userName,
      phone: userPhone,
      scores: scores
    }));
  } catch (e) { console.error(e); }

  // 2. Trigger Webhook in background if configured
  const webhookUrl = localStorage.getItem('lap_disc_webhook');
  if (webhookUrl && webhookUrl.trim().startsWith('http')) {
    const payload = {
      event: "disc_test_completed",
      student: {
        name: userName,
        phone: userPhone
      },
      results: {
        dominantProfile: p.name,
        keyword: p.keyword,
        scores: { D: pctD, I: pctI, S: pctS, C: pctC }
      },
      comments: [p.d1, p.d2, p.d3],
      growthAdvice: p.growth,
      completedAt: result.date
    };

    fetch(webhookUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(r => console.log('Webhook dispatched successfully:', r.status))
    .catch(err => console.error('Webhook dispatch failed:', err));
  }
}

function sendWhatsApp(target) {
  const c = CONTENT[lang];
  const scores = calcScores();
  const sorted = Object.entries(scores).sort((a,b) => b[1]-a[1]);
  const [topDim] = sorted[0];

function restart() {
  document.getElementById('nameInput').value = '';
  document.getElementById('phoneInput').value = '';
  document.getElementById('startBtn').disabled = true;
  document.getElementById('instructions-box').classList.remove('visible');
  answers = new Array(24).fill(null); currentQ = 0;
  showScreen('intro');
}

// ── ADMIN FUNCTIONS ──
function checkAdminRoute() {
  if (window.location.hash === '#admin') {
    showScreen('admin');
    renderAdminTable();
    loadWebhookInput();
  }
}

function closeAdmin() {
  window.location.hash = '';
  showScreen('intro');
}

function loadWebhookInput() {
  const saved = localStorage.getItem('lap_disc_webhook') || '';
  const input = document.getElementById('webhookInput');
  if (input) input.value = saved;
}

function saveWebhook() {
  const url = document.getElementById('webhookInput').value.trim();
  localStorage.setItem('lap_disc_webhook', url);
  alert(lang === 'pt' ? 'Webhook salvo com sucesso!' : '¡Webhook guardado con éxito!');
}

function renderAdminTable() {
  let saved = [];
  try {
    const raw = localStorage.getItem('lap_disc_results');
    if (raw) saved = JSON.parse(raw);
  } catch(e) {}
  
  // Sort descending by date
  saved.sort((a, b) => b.rawDate - a.rawDate);
  
  const body = document.getElementById('adminTableBody');
  if (!body) return;
  body.innerHTML = '';
  
  if (saved.length === 0) {
    body.innerHTML = `<tr><td colspan="8" style="text-align:center; color: var(--text3); padding: 20px;">Nenhum aluno cadastrado ainda.</td></tr>`;
    return;
  }
  
  saved.forEach(r => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${r.date}</td>
      <td style="font-weight: 600;">${r.name}</td>
      <td><a href="https://wa.me/${r.phone.replace(/\D/g, '')}" target="_blank" style="color: var(--navy); text-decoration: underline;">${r.phone}</a></td>
      <td>${r.profile}</td>
      <td style="color: var(--red-txt); font-weight: 600;">${r.pctD}%</td>
      <td style="color: var(--amber-txt); font-weight: 600;">${r.pctI}%</td>
      <td style="color: var(--teal-txt); font-weight: 600;">${r.pctS}%</td>
      <td style="color: var(--blue-txt); font-weight: 600;">${r.pctC}%</td>
    `;
    body.appendChild(tr);
  });
}

function filterAdminTable() {
  const query = document.getElementById('adminSearch').value.toLowerCase();
  const rows = document.querySelectorAll('#adminTableBody tr');
  rows.forEach(row => {
    const text = row.textContent.toLowerCase();
    row.style.display = text.includes(query) ? '' : 'none';
  });
}

function clearResults() {
  const msg = lang === 'pt' 
    ? 'Tem certeza de que deseja apagar todos os resultados dos alunos? Esta ação não pode ser desfeita.' 
    : '¿Está seguro de que desea eliminar todos los resultados de los estudiantes? Esta acción no se puede deshacer.';
  if (confirm(msg)) {
    localStorage.removeItem('lap_disc_results');
    renderAdminTable();
  }
}

function clearLocalTest() {
  const msg = lang === 'pt' 
    ? 'Tem certeza de que deseja liberar este aparelho para um novo teste? O resultado anterior deste aparelho não será mais exibido ao abrir a página (mas continuará salvo no histórico).' 
    : '¿Está seguro de que deseja liberar este dispositivo para una nueva prueba? El resultado anterior de este dispositivo ya no se mostrará al abrir la página (pero permanecerá guardado en el historial).';
  if (confirm(msg)) {
    localStorage.removeItem('lap_my_result');
    closeAdmin();
  }
}

function exportCSV() {
  let saved = [];
  try {
    const raw = localStorage.getItem('lap_disc_results');
    if (raw) saved = JSON.parse(raw);
  } catch(e) {}
  
  if (saved.length === 0) {
    alert(lang === 'pt' ? 'Não há resultados para exportar.' : 'No hay resultados para exportar.');
    return;
  }
  
  let csv = 'Data,Nome,WhatsApp,Perfil Principal,D_Pct,I_Pct,S_Pct,C_Pct\n';
  
  saved.forEach(r => {
    const name = `"${r.name.replace(/"/g, '""')}"`;
    const profile = `"${r.profile.replace(/"/g, '""')}"`;
    csv += `${r.date},${name},${r.phone},${profile},${r.pctD},${r.pctI},${r.pctS},${r.pctC}\n`;
  });
  
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.setAttribute('href', url);
  link.setAttribute('download', `LAP_DISC_Alunos_${new Date().toISOString().slice(0,10)}.csv`);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

// Event delegation for admin dblclick on logos
document.body.addEventListener('dblclick', (e) => {
  if (e.target.closest('.lap-logo') || e.target.closest('.lap-logo-sm')) {
    window.location.hash = '#admin';
    showScreen('admin');
    renderAdminTable();
    loadWebhookInput();
  }
});

function initApp() {
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.has('reset') || urlParams.has('novo')) {
    localStorage.removeItem('lap_my_result');
    const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + window.location.hash;
    window.history.replaceState({ path: cleanUrl }, '', cleanUrl);
  }

  renderIntro();

  if (window.location.hash !== '#admin') {
    const savedMyResult = localStorage.getItem('lap_my_result');
    if (savedMyResult) {
      try {
        const parsed = JSON.parse(savedMyResult);
        if (parsed && parsed.name && parsed.phone && parsed.scores) {
          userName = parsed.name;
          userPhone = parsed.phone;
          renderResult(parsed.scores);
          showScreen('result');
          return;
        }
      } catch(e) { console.error(e); }
    }
  }

  checkAdminRoute();
}

// Watch hash changes
window.addEventListener('hashchange', checkAdminRoute);

initApp();
</script>
